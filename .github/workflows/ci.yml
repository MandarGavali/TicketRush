name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketrush
          POSTGRES_PASSWORD: ticketrush
          POSTGRES_DB: ticketrush
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketrush"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ticketrush:ticketrush@localhost:5432/ticketrush
      TEST_DATABASE_URL: postgresql+psycopg://ticketrush:ticketrush@localhost:5432/ticketrush_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Create test database
        run: PGPASSWORD=ticketrush psql -h localhost -U ticketrush -d ticketrush -c "CREATE DATABASE ticketrush_test"

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Tests
        run: pytest -v
